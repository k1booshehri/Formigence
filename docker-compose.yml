services:
  postgres:
    image: postgres:16
    container_name: formigence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-formigence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-formigence}
      POSTGRES_DB: ${POSTGRES_DB:-formigence}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-formigence} -d ${POSTGRES_DB:-formigence}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
